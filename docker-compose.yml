services:
  db:
    image: postgres:16-alpine
    container_name: evolve-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evolve
    ports:
      - "5432:5432"
    volumes:
      - evolve-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolve"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evolve-db:
